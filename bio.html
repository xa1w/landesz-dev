<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tom — landesz.dev</title>
<meta name="description" content="tom · developer & photographer in Lyon. links, status, what's playing." />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230a0a0c'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-weight='700' font-size='17' fill='%23fff' text-anchor='middle'%3Et%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/bio.css" />
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="enter" data-enter><span>click to enter</span></div>

<main class="wrap">
  <section class="glass card" data-card>
    <header class="id">
      <img class="avatar" src="/avatar.jpg" alt="tom" width="200" height="200" />
      <div class="id__text">
        <h1 class="name">tom
          <span class="badges" aria-label="badges">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 8l10 6 10-6-10-6zm0 10.5L4.5 8 12 3.5 19.5 8 12 12.5zM2 12l10 6 10-6v3l-10 6-10-6v-3z"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l-6 7 6 7 1.5-1.4L4.9 12l4.6-5.6zm8 0l-1.5 1.4L19.1 12l-4.6 5.6L16 19l6-7z"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3L7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 5.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
          </span>
        </h1>
        <p class="bio"><span data-type></span><span class="caret">|</span></p>
        <p class="meta">16 · Lyon, FR · hu fr ru en</p>
      </div>
    </header>

    <div class="row">
      <div class="glass sub presence" data-discord-id="">
        <div class="presence__av">
          <img src="/avatar.jpg" alt="" width="72" height="72" />
          <i class="dot" data-dot></i>
        </div>
        <div class="sub__text">
          <b>xa1w</b>
          <span data-presence>currently building landesz.dev</span>
        </div>
      </div>

      <a class="glass sub playing" href="/#work">
        <img src="/work/seven.jpg" alt="" width="120" height="75" />
        <div class="sub__text">
          <b>Seven</b>
          <span>latest build · free IB revision</span>
          <div class="mini"><i style="width:62%"></i><em>in progress</em></div>
        </div>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </a>
    </div>

    <nav class="socials" aria-label="links">
      <a href="https://github.com/xa1w" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.9 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>
      </a>
      <a href="mailto:tom@landesz.dev" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M2 5h20v14H2zm2 2v.4l8 5 8-5V7zm0 2.7V17h16V9.7l-8 5z"/></svg>
      </a>
      <a href="/" aria-label="landesz.dev">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3a15 15 0 0 0-1.2-5.2A8 8 0 0 1 18.9 11zM12 4c.9 1.2 1.7 3.6 1.9 7h-3.8c.2-3.4 1-5.8 1.9-7zM5.1 11a8 8 0 0 1 4.2-5.2A15 15 0 0 0 8.1 11zm0 2h3a15 15 0 0 0 1.2 5.2A8 8 0 0 1 5.1 13zM12 20c-.9-1.2-1.7-3.6-1.9-7h3.8c-.2 3.4-1 5.8-1.9 7zm2.7-1.8a15 15 0 0 0 1.2-5.2h3a8 8 0 0 1-4.2 5.2z"/></svg>
      </a>
    </nav>

    <footer class="foot">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0-7a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1z"/></svg><b data-time>--:--</b> local</span>
      <i></i>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>lyon, fr</span>
    </footer>
  </section>

  <section class="glass card player" data-player>
    <div class="cover" data-cover><span>♪</span></div>
    <div class="player__body">
      <b class="track" data-track>drop a song at public/music/track.mp3</b>
      <div class="pbar">
        <span data-cur>0:00</span>
        <div class="pbar__line" data-seek><i data-prog></i></div>
        <span data-dur>0:00</span>
        <div class="ctl">
          <button data-back aria-label="Back 10s"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button data-toggle aria-label="Play"><svg data-ico-play viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg data-ico-pause viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
          <button data-fwd aria-label="Forward 10s"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        </div>
      </div>
    </div>
    <audio data-audio preload="metadata" src="/music/track.mp3"></audio>
  </section>
</main>

<script type="module" src="/src/bio.js"></script>
</body>
</html>
